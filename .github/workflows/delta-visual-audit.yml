name: KHILADI Delta Live Visual Audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: khiladi/frontend/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: khiladi/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: khiladi/frontend
      - name: Capture live Khiladi and Delta across viewports
        working-directory: khiladi/frontend
        run: |
          export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f | head -1)"
          if [ -z "$CHROMIUM_PATH" ]; then export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -type f | head -1)"; fi
          node scripts/delta-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-khiladi-visual-comparison
          path: docs/qa/delta-live
          retention-days: 10
