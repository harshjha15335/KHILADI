name: KHILADI Delta Live Visual Audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: khiladi-delta-visual-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  screenshot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: khiladi/frontend/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: khiladi/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: khiladi/frontend
      - name: Start built-branch browser preview
        working-directory: khiladi/frontend
        run: |
          VITE_GITHUB_PAGES=true VITE_MEDIA_REVIEW=false npm run dev -- --host 127.0.0.1 --port 3000 >/tmp/khiladi-audit-preview.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: Capture live Delta and current Khiladi PR across viewports
        working-directory: khiladi/frontend
        env:
          KHILADI_BASE_URL: "http://127.0.0.1:3000/#"
          KHILADI_PRODUCTION_URL: "https://khiladi-six.vercel.app/#"
        run: |
          export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f | head -1)"
          if [ -z "$CHROMIUM_PATH" ]; then export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -type f | head -1)"; fi
          node scripts/delta-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-khiladi-visual-comparison
          path: docs/qa/delta-live
          retention-days: 10
