name: Deploy KHILADI to GitHub Pages
on:
  push:
    branches: [main, migration/windows-and-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: khiladi/frontend/package-lock.json
      - run: python -m pip install -r khiladi/backend/requirements.txt
      - run: python scripts/export_pages_quiz.py
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: khiladi/frontend
      - run: npm run build
        working-directory: khiladi/frontend
        env:
          VITE_BASE_PATH: /KHILADI/
          VITE_GITHUB_PAGES: 'true'
          VITE_MEDIA_REVIEW: 'false'
      - run: python scripts/check_pages_artifact.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: khiladi/frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
